[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiltguard"
version = "1.0.0"
description = "Trader behaviour and risk-rule monitoring for prop firms and copy-trading platforms"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "openpyxl>=3.1"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
app = ["streamlit>=1.35"]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27", "fastapi>=0.110", "streamlit>=1.35"]

[project.scripts]
tiltguard = "tiltguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 112
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
